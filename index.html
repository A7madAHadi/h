<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بۆ ئازیزی دڵم</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0408;
            overflow: hidden;
            position: relative;
        }

        /* رووناکی هێمن و شیک لە پاشخان */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 75, 110, 0.18) 0%, rgba(100, 15, 45, 0.08) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 1;
        }

        /* کارتی شوشەیی مینیمال */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 55px 40px 45px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            max-width: 440px;
            width: 88%;
            z-index: 10;
            position: relative;
        }

        /* کۆنتڕۆڵی دەنگ */
        .audio-control {
            position: absolute;
            top: 22px;
            right: 22px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 17px;
            color: white;
            transition: all 0.3s ease;
        }

        .audio-control:hover {
            background: rgba(255, 75, 110, 0.2);
            transform: scale(1.08);
        }

        .heart-icon {
            font-size: 60px;
            display: inline-block;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255, 75, 110, 0.4));
        }

        h2 {
            color: #ffffff;
            margin-bottom: 18px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        p {
            color: #e5d2dc;
            font-size: 16.5px;
            margin-bottom: 38px;
            line-height: 1.9;
            font-weight: 300;
        }

        /* دوگمەکان */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 14px 40px;
            font-size: 16.5px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff4b6e 0%, #e63956 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 75, 110, 0.3);
        }

        .btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 75, 110, 0.45);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.06);
            color: #d1c0c9;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: absolute;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <audio id="bgMusic" src="ewini be kota.mp3" loop autoplay preload="auto"></audio>

    <div class="card">
        <div class="audio-control" id="audioBtn" onclick="toggleMusic()">🎵</div>

        <div id="cardContent">
            <div class="heart-icon">💌</div>
            <h2>نامەیەکی تایبەت</h2>
            <p>سڵاو دینی...<br>نامەیەکی کورت لە دڵمەوە بۆ تۆ، تکایە بیکەرەوە.</p>
            <div class="btn-container">
                <button class="btn-yes" onclick="nextStep1()">بیکەرەوە ✨</button>
            </div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const audioBtn = document.getElementById('audioBtn');

        document.body.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                audioBtn.innerText = '🎵';
            }
        }, { once: true });

        function toggleMusic() {
            if (music.paused) {
                music.play();
                audioBtn.innerText = '🎵';
            } else {
                music.pause();
                audioBtn.innerText = '🔇';
            }
        }

        function nextStep1() {
            if (music.paused) music.play();

            document.getElementById('cardContent').innerHTML = `
                <div class="heart-icon">📜</div>
                <h2>بۆ تۆ، کە هەموو دنیای منی...</h2>
                <p>تۆ تەنها سەرەتایەک نیت بۆ ژیانم، تۆ جوانترین پارچەی تەمەنی منیت. لەو ڕۆژەوەی هاتووی، دڵم ئارامترە و داهاتووم ڕووناکترە. هەمیشە خەونی من ئەوە بووە کە قەشەنگترین چیرۆکی عەشق پێکەوە بنووسینەوە...</p>
                <div class="btn-container">
                    <button class="btn-yes" onclick="nextStep2()">هەنگاوی داهاتوو 💍</button>
                </div>
            `;
        }

        function nextStep2() {
            document.getElementById('cardContent').innerHTML = `
                <div class="heart-icon">💍</div>
                <h2>دینی، دەبیت بە هاوسەری ژیانم؟</h2>
                <p>پێش ئەوەی وەڵام بدەیتەوە، باش بیر بکەرەوە! چونکە دڵم بڕیاری خۆی داوە...</p>
                <div class="btn-container" id="quizContainer">
                    <button class="btn-yes" onclick="accepted()">بەڵێ 💖</button>
                    <button class="btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">نەخێر</button>
                </div>
            `;
        }

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.getElementById('quizContainer');
            
            const maxWidth = container.clientWidth - noBtn.clientWidth;
            const maxHeight = 120;
            
            const randomX = Math.floor(Math.random() * maxWidth) - (maxWidth / 2);
            const randomY = Math.floor(Math.random() * maxHeight) - (maxHeight / 2);
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function accepted() {
            if (music.paused) music.play();
            
            document.getElementById('cardContent').innerHTML = `
                <div class="heart-icon">👑</div>
                <h2>سوپاس بۆ بوونت...</h2>
                <p>بەڵێن بێت نەهێڵم پەشیمان ببیتەوە 💍🌸</p>
            `;
        }
    </script>
</body>
</html>
