<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بۆ ئازیزی دڵم</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090308;
            position: fixed;
            top: 0;
            left: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* درەوشانەوەی ئارامی پاشخان */
        .bg-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255, 75, 110, 0.22) 0%, rgba(120, 15, 50, 0.08) 60%, transparent 80%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            filter: blur(50px);
            pointer-events: none;
            z-index: 1;
        }

        /* کانتینەری ئەستێرە درەوشاوەکان */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.6); }
            50% { opacity: 0.95; transform: scale(1.2); }
        }

        /* کارتی شوشەیی ناوەڕاست */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px 22px 30px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            width: 90%;
            max-width: 400px;
            z-index: 10;
            position: relative;
            margin: auto;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* کۆنتڕۆڵی دەنگ */
        .audio-control {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
        }

        .audio-control:hover {
            background: rgba(255, 75, 110, 0.25);
        }

        .heart-icon {
            font-size: 50px;
            display: inline-block;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px rgba(255, 75, 110, 0.4));
        }

        h2 {
            color: #ffffff;
            margin-bottom: 14px;
            font-size: 22px;
            font-weight: 800;
        }

        p {
            color: #e5d2dc;
            font-size: 14.5px;
            margin-bottom: 25px;
            line-height: 1.8;
            font-weight: 300;
            text-align: justify;
            text-align-last: center;
        }

        /* ئەنیمەیشنی تایپکردنی ناوەکان */
        .dynamic-name {
            color: #ff4b6e;
            border-left: 2px solid #ff4b6e;
            padding-left: 3px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* دوگمەکان */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            min-height: 55px;
        }

        button {
            padding: 13px 36px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff4b6e 0%, #e63956 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 75, 110, 0.35);
        }

        .btn-yes:active {
            transform: scale(0.96);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: #d1c0c9;
            border: 1px solid rgba(255, 255, 255, 0.18);
            position: absolute;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="stars-container" id="starsContainer"></div>

    <audio id="bgMusic" src="ewini be kota.mp3" loop autoplay preload="auto"></audio>

    <div class="card">
        <div class="audio-control" id="audioBtn" onclick="toggleMusic()">🎵</div>

        <div id="cardContent">
            <div class="heart-icon">💌</div>
            <h2>نامەیەکی تایبەت</h2>
            <p style="text-align: center;">دۆرا بەدڵێکی گەورەوە وەری گرە</p>
            <div class="btn-container">
                <button class="btn-yes" onclick="nextStep1()">بیکەرەوە ✨</button>
            </div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const audioBtn = document.getElementById('audioBtn');
        const starsContainer = document.getElementById('starsContainer');

        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 1.5) + 's');
            star.style.animationDelay = (Math.random() * 3) + 's';
            starsContainer.appendChild(star);
        }

        document.body.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                audioBtn.innerText = '🎵';
            }
        }, { once: true });

        function toggleMusic() {
            if (music.paused) {
                music.play();
                audioBtn.innerText = '🎵';
            } else {
                music.pause();
                audioBtn.innerText = '🔇';
            }
        }

        let loopIntervals = [];

        function clearAllIntervals() {
            loopIntervals.forEach(id => clearTimeout(id));
            loopIntervals = [];
        }

        function startNameLoopMulti(elementIds) {
            clearAllIntervals();
            const names = ["دینی", "دۆرا"];
            let nameIndex = 0;
            let charIndex = 0;
            let isDeleting = false;

            function type() {
                const currentName = names[nameIndex];

                elementIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        if (isDeleting) {
                            el.textContent = currentName.substring(0, charIndex - 1);
                        } else {
                            el.textContent = currentName.substring(0, charIndex + 1);
                        }
                    }
                });

                if (isDeleting) {
                    charIndex--;
                } else {
                    charIndex++;
                }

                let speed = isDeleting ? 100 : 150;

                if (!isDeleting && charIndex === currentName.length) {
                    speed = 1800;
                    isDeleting = true;
                } else if (isDeleting && charIndex === 0) {
                    isDeleting = false;
                    nameIndex = (nameIndex + 1) % names.length;
                    speed = 400;
                }

                const timer = setTimeout(type, speed);
                loopIntervals.push(timer);
            }

            type();
        }

        function nextStep1() {
            if (music.paused) music.play();

            document.getElementById('cardContent').innerHTML = `
                <div class="heart-icon">📜</div>
                <h2>نامەیەک بۆ <span id="changingName1" class="dynamic-name"></span></h2>
                <p>ئەزانم کە ئەمە زۆر لە پڕێکایە کە من داواکاری شتێکی وات لێ ئەکەم بەس من زۆر دەمێکەیە کە ئەمویست پێت بڵێم بەڵام هەرچیەکم ئەکرد نەم ئەتوانی، هەرچەنە لەوانەیە تۆ بڵێ کە من هیچم نەکردوە کەوا دەر بکەوێ بەس من چەنجارێک هەڵوم یاوە کە ئەگەر بۆ تۆزێکیش بوبێت خۆمت لێ نزیک بکەمەوە بەس هەموو جارێکیش فەشەلم هێناوە جا ئێستا نازانم کە ئایە ئەمە شێوازێکی گونجاوە یان نا بۆ دەر بڕینی هەستەکانم بۆ تۆ، هەرچەنە هیچ وشەیەکم پێنیە کە بتوانێت وەسفی هەستەکانم بکات بۆتۆ، وە هیوادارن ئەگەر بۆ تۆزێکیش بێت بیری لێ بکەیتەوە کە شایەنی ئەوەبم هەڵێکم پێ بدرێت.</p>
                <div class="btn-container">
                    <button class="btn-yes" onclick="nextStep2()">هەنگاوی داهاتوو 💍</button>
                </div>
            `;

            startNameLoopMulti(["changingName1"]);
        }

        function nextStep2() {
            document.getElementById('cardContent').innerHTML = `
                <div class="heart-icon">💍</div>
                <h2><span id="changingNameTitle" class="dynamic-name"></span>، دەبیت بە هاوسەری ژیانم؟</h2>
                <p><span id="changingNameBody" class="dynamic-name"></span> پێش ئەوەی جوابم بەیتەوە بیری لێ بکەرەوە ئەگەر بۆ کەمێکیش بێت، یان هەر کاتێک ویستت ئەوکاتە جوابم بەرەوە من ٣ ساڵ چاوەڕێم کرد تا بتوانم ئەمەت پێ بڵێم ماوەیەکی تریش چاوەڕێ ئەکەم.</p>
                <div class="btn-container" id="quizContainer">
                    <button class="btn-yes" onclick="accepted()">بەڵێ 💖</button>
                    <button class="btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">نەخێر</button>
                </div>
            `;

            startNameLoopMulti(["changingNameTitle", "changingNameBody"]);
        }

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.getElementById('quizContainer');
            
            const maxWidth = container.clientWidth - noBtn.clientWidth;
            const maxHeight = 100;
            
            const randomX = Math.floor(Math.random() * maxWidth) - (maxWidth / 2);
            const randomY = Math.floor(Math.random() * maxHeight) - (maxHeight / 2);
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function accepted() {
            clearAllIntervals();
            if (music.paused) music.play();
            
            document.getElementById('cardContent').innerHTML = `
                <div class="heart-icon">🌸</div>
                <h2>سپاس بۆ ئەو هەلەی کە پێت یام</h2>
                <p style="text-align: center;">بەڵێن بێت نەهێڵم پەشیمان ببیتەوە 💍🌸</p>
            `;
        }
    </script>
</body>
</html>
